<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" />
    <script>
      (function () {
        var baseHref = '/lucasacioly-portfolio/';
        var path = window.location.pathname;

        if (path.indexOf(baseHref) === 0) {
          path = path.slice(baseHref.length);
        }

        // Detect certificate asset URLs and redirect to hash-based routes
        var certsMatch = path.match(/^content\/images\/certs\/(.+)/);
        if (certsMatch) {
          var certPath = decodeURIComponent(certsMatch[1]);
          window.location.replace(baseHref + '#/certs/' + certPath);
          return;
        }

        path = path + window.location.search + window.location.hash;
        window.location.replace(baseHref + '?p=' + encodeURIComponent(path));
      })();
    </script>
    <style>
      * {
        line-height: 1.2;
        margin: 0;
      }

      html {
        color: #888;
        display: table;
        font-family: sans-serif;
        height: 100%;
        text-align: center;
        width: 100%;
      }

      body {
        display: table-cell;
        vertical-align: middle;
        margin: 2em auto;
      }

      h1 {
        color: #555;
        font-size: 2em;
        font-weight: 400;
      }

      p {
        margin: 0 auto;
        width: 280px;
      }

      @media only screen and (max-width: 280px) {
        body,
        p {
          width: 95%;
        }

        h1 {
          font-size: 1.5em;
          margin: 0 0 0.3em;
        }
      }
    </style>
  </head>
  <body>
    <h1>Page Not Found</h1>
    <p>Sorry, but the page you were trying to view does not exist.</p>
  </body>
</html>
<!-- IE needs 512+ bytes: http://blogs.msdn.com/b/ieinternals/archive/2010/08/19/http-error-pages-in-internet-explorer.aspx -->
